<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

  <div id="calculator">
    <!-- TOP RIGHT ICONS -->
    <div id="top-icons">
      <button onclick="toggleHistory()" title="History">
        <i class="fas fa-history"></i></button>
      <button onclick="togglePreview()" title="Preview">
        <i class="fas fa-eye"></i></button>
      <button onclick="saveCalc()" title="Save">
        <i class="fas fa-save"></i></button>
      <button onclick="recallResult()" title="Recall Last Result">
        <i class="fas fa-record-vinyl"></i></button>
      <button onclick="redoLast()" title="Redo Last Calculation"><i class="fas fa-redo"></i></button>
    </div>

    <!-- NUMBER KEYPAD -->
    <div id="keys">
      <button onclick="appendtodisplay('0')">0</button>
      <button onclick="appendtodisplay('3')">3</button>
      <button onclick="appendtodisplay('6')">6</button>
      <button onclick="appendtodisplay('9')">9</button>

      <button onclick="appendtodisplay('1')">1</button>
      <button onclick="appendtodisplay('4')">4</button>
      <button onclick="appendtodisplay('7')">7</button>
      <button class="equal" onclick="calculate()">=</button>

      <button onclick="appendtodisplay('2')">2</button>
      <button onclick="appendtodisplay('5')">5</button>
      <button onclick="appendtodisplay('8')">8</button>
    </div>

    <!-- DISPLAY (between keypad and signs) -->
    <input type="text" id="screen" value="" readonly>

    <!-- OPERATOR / SIGNS ROW -->
    <div class="operator">
      <button onclick="appendtodisplay('+')">+</button>
      <button onclick="appendtodisplay('-')">-</button>
      <button onclick="appendtodisplay('*')">*</button>
      <button onclick="appendtodisplay('/')">/</button>
      <button onclick="appendtodisplay('%')">%</button>

      <button onclick="appendtodisplay('^')">EXP</button>
      <button onclick="appendtodisplay('.')">.</button>
      <button onclick="clearDisplay()" class="clear-btn">C</button>
      <button onclick="deleteLast()" class="delete-btn">&#9003;</button>
    </div>

    <!-- HISTORY PANEL -->
    <div id="historyPanel" style="display:none;">
      <h3>History</h3>
      <div id="historyList"></div>
      <button onclick="clearHistory()" id="clearHistoryBtn">Clear History</button>
    </div>

    <!-- PREVIEW PANEL -->
    <div id="previewPanel" style="display:none;">
      <h3>Preview</h3>
      <div id="previewList"></div>
    </div>

  </div>

  <script src="index.js"></script>
</body>
</html>
